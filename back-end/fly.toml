# Signa back-end on Fly.io. Deploy from back-end/: `fly deploy --ha=false`.
# Secrets (Supabase, JWT, Telegram, APNs) are NOT here: `fly secrets set ...`.
#
# Exactly ONE machine, always on: the scheduler runs inside the app (quotes
# every minute, nightly jobs), so a second machine would run every job twice
# and a stopped one would run none. Hence --ha=false, no auto-stop, and the
# rolling strategy (with one machine it stops the old one before starting the
# new one; bluegreen/canary would run two at once).

app = "signa-api"
primary_region = "iad"   # Ashburn, Virginia: next to the Supabase project (us-east-1)

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"

[env]
  DEBUG = "false"
  DEV_TOOLS_ENABLED = "false"
  LOGIN_OTP_ENABLED = "true"
  TELEGRAM_ENABLED = "false"          # off: no Telegram options for users, nothing sent
  TELEGRAM_POLLING = "false"          # when on, the webhook receives bot messages
  LOG_FILE_DIR = ""                   # logs go to stdout (`fly logs`); the disk is temporary
  CLIENT_IP_HEADER = "Fly-Client-IP"  # the visitor's IP for rate limits
  CORS_ORIGINS = '["https://mysigna.app"]'
  OTP_EXPIRE_SECONDS = "120"          # sign-in codes (the code default, 30 s, is too short)

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
